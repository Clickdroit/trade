[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-bot"
version = "0.1.0"
description = "Educational BTC/USDT trading bot — Binance Spot Testnet only"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.4,<5",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
trade-bot = "tradebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
